<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ponctuel</title>
<style>
  @font-face {
    font-family: "Cinzel"; font-weight: 400 900; font-display: swap;
    src: url("doomsday/polices/cinzel.woff2") format("woff2");
  }
  :root {
    --bg: #020604; --surface: rgba(8, 24, 16, .9); --text: #eaf6ef; --muted: #a3c2b0;
    --border: rgba(216, 179, 106, .3); --primary: #39f29a; --focus: #d8b36a; --metal: #ece0c4;
    --radius: 12px; --speed: 160ms;
    color-scheme: dark;
    background: radial-gradient(ellipse 110% 60% at 50% 0%, #0a2a1a, var(--bg) 70%) var(--bg);
  }
  ::selection { background: rgba(57, 242, 154, .35); color: #fff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { margin: 0 0 4px; font: 700 2.25rem/1.2 "Cinzel", Georgia, serif; letter-spacing: .06em; color: var(--metal); text-shadow: 0 0 24px rgba(57, 242, 154, .35); }
  .intro { margin: 0 0 32px; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.app {
    display: flex; align-items: center; gap: 16px; min-height: 64px;
    padding: 16px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); color: inherit; text-decoration: none;
    transition: border-color var(--speed) ease, transform var(--speed) ease;
  }
  a.app:hover { border-color: var(--primary); box-shadow: 0 0 22px rgba(57, 242, 154, .2); }
  a.app:active { transform: scale(.99); }
  a.app:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .txt { flex: 1; min-width: 0; }
  .nom { display: block; font-weight: 600; }
  .desc { display: block; color: var(--muted); font-size: .9375rem; overflow-wrap: anywhere; }
  .date { color: var(--focus); font-size: .875rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chev { flex: none; color: var(--primary); }
  .vide {
    padding: 32px 16px; text-align: center; color: var(--muted);
    border: 1px dashed var(--border); border-radius: var(--radius);
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Ponctuel</h1>
  <p class="intro">Les mini-apps faites pour une occasion.</p>
  <ul id="liste"></ul>
  <p class="vide" id="vide" hidden>Aucune mini-app pour l'instant.</p>
</main>
<script>
  // Pour ajouter une mini-app : une ligne de plus ici (lien relatif vers son fichier).
  const APPS = [
    { nom: "Quiz Avengers Doomsday", desc: "Quiz entre amis avant de voir le film", date: "2026-11", lien: "doomsday/index.html" },
    // { nom: "Carte du monde", desc: "Placer les pays sur la carte", date: "2026-12", lien: "carte-du-monde/index.html" },
  ];

  const liste = document.getElementById("liste");
  if (!APPS.length) document.getElementById("vide").hidden = false;
  for (const app of APPS) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.className = "app";
    a.href = app.lien;
    const txt = document.createElement("span");
    txt.className = "txt";
    const nom = document.createElement("span");
    nom.className = "nom"; nom.textContent = app.nom;
    txt.append(nom);
    if (app.desc) {
      const d = document.createElement("span");
      d.className = "desc"; d.textContent = app.desc;
      txt.append(d);
    }
    a.append(txt);
    if (app.date) {
      const dt = document.createElement("span");
      dt.className = "date"; dt.textContent = app.date;
      a.append(dt);
    }
    a.insertAdjacentHTML("beforeend",
      '<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>');
    li.append(a);
    liste.append(li);
  }
</script>
</body>
</html>
